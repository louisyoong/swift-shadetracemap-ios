name: ShadeTraceMap
options:
  developmentLanguage: en
  bundleIdPrefix: com.shadetracemap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.30.0
settings:
  base:
    DEVELOPMENT_TEAM: M9VG7M352C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  ShadeTraceMap:
    type: application
    platform: iOS
    sources:
      - ShadeTraceMap
    dependencies:
      - package: MapLibre
      - target: SunsetWidget
    postBuildScripts:
      # MapLibre ships prebuilt without a dSYM, so App Store uploads warn
      # "Upload Symbols Failed". Generate one from the embedded binary (same
      # UUID) so the archive's dSYMs folder is complete.
      - name: Generate MapLibre dSYM
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/MapLibre.framework/MapLibre
        outputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/MapLibre.framework.dSYM
        script: |
          [ "$CONFIGURATION" = "Release" ] || exit 0
          xcrun dsymutil "$SCRIPT_INPUT_FILE_0" -o "$SCRIPT_OUTPUT_FILE_0" 2>&1 | grep -v "no debug symbols" || true
    entitlements:
      path: ShadeTraceMap/ShadeTraceMap.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shadetracemap.shadetracemap
    info:
      path: ShadeTraceMap/Info.plist
      properties:
        CFBundleDisplayName: ShadeTrace Map
        # Only HTTPS / system crypto: skips the export-compliance prompt on each upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: ShadeTrace Map uses your location to center the map on where you are.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Same bundle ID as the App Store app: installing this replaces the
        # Flutter build on a device, and an upload becomes an update for it.
        PRODUCT_BUNDLE_IDENTIFIER: com.shadetracemap.shadetracemap
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SunsetWidget:
    type: app-extension
    platform: iOS
    sources:
      - SunsetWidget
    entitlements:
      path: SunsetWidget/SunsetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shadetracemap.shadetracemap
    info:
      path: SunsetWidget/Info.plist
      properties:
        CFBundleDisplayName: Sunset
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shadetracemap.shadetracemap.SunsetWidget
        TARGETED_DEVICE_FAMILY: "1,2"
